name: Prototype checks
on:
  push:
  pull_request:
jobs:
  python-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser DOM test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run model self-test
        run: python engine/pulp_riot_model.py --test
      - name: Run operational engine and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check web/operations.js
          node --check web/operations-v2.js
          node --check web/live.js
      - name: Exercise streamed UI and decision forms
        run: |
          python scripts/export_live_fixture.py
          npm run test:ui
