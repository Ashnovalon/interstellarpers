data:
  file-0: "{\n  \"uid\": \"real-records\",\n  \"title\": \"Real records operations\"\
    ,\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"10s\",\n  \"\
    panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"stat\",\n      \"title\"\
    : \"API scrape health\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"\
    y\": 0,\n        \"w\": 8,\n        \"h\": 5\n      },\n      \"targets\": [\n\
    \        {\n          \"expr\": \"up{job=\\\"real-records-api\\\"}\"\n       \
    \ }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"Imported records / second\",\n      \"gridPos\": {\n   \
    \     \"x\": 8,\n        \"y\": 0,\n        \"w\": 16,\n        \"h\": 8\n   \
    \   },\n      \"targets\": [\n        {\n          \"expr\": \"sum by(kind) (rate(real_records_imported_total[5m]))\"\
    ,\n          \"legendFormat\": \"{{kind}}\"\n        }\n      ]\n    },\n    {\n\
    \      \"id\": 3,\n      \"type\": \"timeseries\",\n      \"title\": \"API memory\"\
    ,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 8,\n        \"w\":\
    \ 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n         \
    \ \"expr\": \"process_resident_memory_bytes{job=\\\"real-records-api\\\"}\"\n\
    \        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"API latency p95 (seconds)\",\n      \"gridPos\": {\n   \
    \     \"x\": 12,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n  \
    \    },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.95,\
    \ sum by(le) (rate(real_records_http_request_seconds_bucket[5m])))\"\n       \
    \ }\n      ]\n    },\n    {\n      \"id\": 5,\n      \"type\": \"stat\",\n   \
    \   \"title\": \"Records waiting for projection\",\n      \"gridPos\": {\n   \
    \     \"x\": 0,\n        \"y\": 16,\n        \"w\": 8,\n        \"h\": 5\n   \
    \   },\n      \"targets\": [\n        {\n          \"expr\": \"real_records_projection_pending\"\
    \n        }\n      ]\n    },\n    {\n      \"id\": 6,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"API failures / second\",\n      \"gridPos\": {\n       \
    \ \"x\": 8,\n        \"y\": 16,\n        \"w\": 16,\n        \"h\": 8\n      },\n\
    \      \"targets\": [\n        {\n          \"expr\": \"sum(rate(real_records_http_requests_total{status=~\\\
    \"5..\\\"}[5m]))\"\n        }\n      ]\n    },\n    {\n      \"id\": 7,\n    \
    \  \"type\": \"timeseries\",\n      \"title\": \"Worker heartbeat age (seconds)\"\
    ,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 24,\n        \"w\"\
    : 24,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n         \
    \ \"expr\": \"time() - real_records_worker_seen_timestamp\",\n          \"legendFormat\"\
    : \"{{service}}\"\n        }\n      ]\n    }\n  ]\n}\n"
  file-1: "apiVersion: 1\nproviders:\n  - name: Real records\n    options: {path:\
