apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config-1
  namespace: pulp-real-records
data:
  file-0: "from datetime import datetime, timedelta\nimport json\nimport os\nfrom\
    \ urllib.request import Request,urlopen\nfrom airflow import DAG\nfrom airflow.operators.python\
    \ import PythonOperator\n\ndef retrain():\n    headers={'Content-Type':'application/json'}\n\
    \    token=os.getenv('REAL_RECORDS_TOKEN','')\n    if token: headers['Authorization']='Bearer\
    \ '+token\n    req=Request('http://api:8000/train',data=b'{}',headers=headers,method='POST')\n\
    \    try:\n        with urlopen(req,timeout=300) as response: print(json.load(response))\n\
    \    except Exception as exc:\n        # Insufficient history is a visible skipped\
    \ training run, never synthetic fill.\n        if getattr(exc,'code',None)==400:\n\
    \            from airflow.exceptions import AirflowSkipException\n           \
    \ raise AirflowSkipException(exc.read().decode())\n        raise\n\nwith DAG('real_record_demand_training',start_date=datetime(2026,1,1),schedule='@daily',catchup=False,\n\
    \         default_args={'retries':2,'retry_delay':timedelta(minutes=5)},tags=['real-records'])\
    \ as dag:\n    PythonOperator(task_id='train_evaluate_version',python_callable=retrain)\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: pulp-real-records
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: airflow
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: airflow
        image: apache/airflow:2.10.4-python3.11
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 1024Mi
        env:
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: 'false'
        - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
          value: 'false'
        - name: AIRFLOW__CORE__EXECUTOR
          value: SequentialExecutor
        - name: AIRFLOW__CORE__PARALLELISM
          value: '2'
        - name: AIRFLOW__WEBSERVER__WORKERS
          value: '1'
        - name: REAL_RECORDS_TOKEN
          value: ''
        args:
        - standalone
        volumeMounts:
        - name: volume-0
          mountPath: /opt/airflow
        - name: volume-1
          mountPath: /opt/airflow/dags
          readOnly: true
      volumes:
      - name: volume-0
        persistentVolumeClaim:
          claimName: airflow
      - name: volume-1
        configMap:
          name: airflow-config-1
          items:
          - key: file-0
            path: demand_training.py
      securityContext:
        fsGroup: 0
